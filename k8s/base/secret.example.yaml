# TEMPLATE.  Copy to secret.yaml (git-ignored) and fill in real values:
#
#   cp k8s/base/secret.example.yaml k8s/base/secret.yaml
#   # then edit, or generate random ones:
#   python3 -c "import secrets;print(secrets.token_urlsafe(24))"
#
# secret.yaml is the *demo* way of getting credentials into the cluster.  In a
# real cluster the Secret is created out-of-band by the tooling in Part 6
# (Sealed Secrets -> committed as ciphertext, or External Secrets -> pulled from
# a vault at deploy time), never hand-committed.  `stringData` is a write-only
# convenience: kubelet stores it base64-encoded in `data`, and base64 is
# encoding, not encryption - anyone with get-secret privileges reads it in one
# command.  That is exactly why Part 6 replaces this file.
apiVersion: v1
kind: Secret
metadata:
  name: tenantbooks-secrets
  labels:
    app: tenantbooks-config
type: Opaque
stringData:
  # root-ish DB user, used ONLY by the create-site Job; the site itself gets a
  # dedicated per-site DB user that bench generates (see docs/part6-db-ops.md).
  DB_ROOT_PASSWORD: change-me
  # Administrator login for the new site
  ADMIN_PASSWORD: change-me
  # HMAC key for outbound webhook signatures; must match the receiver's
  # WEBHOOK_SECRET or every delivery fails verification.
  WEBHOOK_SECRET: change-me
