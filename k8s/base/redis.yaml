# Two Redis instances, on purpose:
#   redis-cache  - request-scoped cache + socket.io; losing it costs nothing.
#   redis-queue  - the job queue itself; losing it loses enqueued PDF/webhook
#                  jobs, so it is run with AOF persistence.
# Frappe keeps them separate so that a cache under memory pressure can evict
# keys without ever touching queued jobs.
apiVersion: v1
kind: Service
metadata:
  name: redis-cache
  labels:
    app: redis-cache
spec:
  selector:
    app: redis-cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-cache
  labels:
    app: redis-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-cache
  template:
    metadata:
      labels:
        app: redis-cache
        tier: redis # NetworkPolicy target (podSelector matches pod labels only)
    spec:
      containers:
        - name: redis
          image: redis:6.2.24-alpine
          imagePullPolicy: IfNotPresent
          # allkeys-lru + a hard maxmemory: a cache that grows unbounded gets
          # OOMKilled by the cgroup, which is a worse failure than evicting.
          command:
            - redis-server
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: redis-queue
  labels:
    app: redis-queue
spec:
  selector:
    app: redis-queue
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-queue
  labels:
    app: redis-queue
spec:
  serviceName: redis-queue
  replicas: 1
  selector:
    matchLabels:
      app: redis-queue
  template:
    metadata:
      labels:
        app: redis-queue
        tier: redis # NetworkPolicy target (podSelector matches pod labels only)
    spec:
      securityContext:
        # redis's alpine image runs as uid 1000 already; fsGroup 1000 makes the
        # AOF file in the new volume owned/group-writable for it.
        fsGroup: 1000
      containers:
        - name: redis
          image: redis:6.2.24-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 256mb
            - --maxmemory-policy
            - noeviction
          # noeviction on the queue: silently dropping LRU keys would delete
          # pending jobs.  Better to error on enqueue than to lose work.
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 320Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
